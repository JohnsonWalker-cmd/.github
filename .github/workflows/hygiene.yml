name: Hygiene check
on:
  workflow_call:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci

      - name: Formatting
        run: npx prettier --check .

      - name: Leftovers sweep
        shell: bash
        run: |
          if grep -rniE "TODO|FIXME|intentionally empty|lorem ipsum|console\.log" \
            --include="*.html" --include="*.css" --include="*.js" --include="*.ts" --include="*.tsx" \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git . ; then
            echo "Leftovers found. Remove them before merging."
            exit 1
          fi

      - name: Lint CSS
        run: npx stylelint "**/*.css"
